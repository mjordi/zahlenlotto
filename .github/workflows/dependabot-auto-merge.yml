name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  # Serialize dependency merges so every CI run is tested against the base it will enter.
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Verify and merge Dependabot update
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify immutable gates and merge
        # Pinned to the v9 commit because this job has write permission.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const expectedSha = run.head_sha;
            const dependabot = 'dependabot[bot]';
            const allowedUpdateTypes = new Set([
              'version-update:semver-minor',
              'version-update:semver-patch',
            ]);

            if (run.actor?.login !== dependabot) {
              throw new Error(`CI was triggered by ${run.actor?.login ?? 'an unknown actor'}, not Dependabot.`);
            }

            const testedPull = (run.pull_requests ?? []).find((pull) =>
              pull.head?.sha === expectedSha && pull.head?.ref === run.head_branch
            );
            const testedBaseSha = testedPull?.base?.sha;
            if (!testedBaseSha) {
              throw new Error('The successful CI run does not identify the tested base SHA.');
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (testedPull.base.ref !== repository.default_branch) {
              throw new Error('The successful CI run did not target the current default branch.');
            }
            const { data: associatedPulls } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: expectedSha,
              });

            const candidates = associatedPulls.filter((pull) =>
              pull.state === 'open' &&
              pull.head.sha === expectedSha &&
              pull.head.ref === run.head_branch &&
              pull.head.repo?.full_name === `${owner}/${repo}` &&
              pull.base.ref === repository.default_branch &&
              pull.user?.login === dependabot
            );

            if (candidates.length !== 1) {
              throw new Error(`Expected exactly one open Dependabot PR for ${expectedSha}; found ${candidates.length}.`);
            }

            const pullNumber = candidates[0].number;
            const getPull = async () =>
              (await github.rest.pulls.get({ owner, repo, pull_number: pullNumber })).data;

            const assertBaseUnchanged = async () => {
              const { data: baseRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${repository.default_branch}`,
              });
              if (baseRef.object.sha !== testedBaseSha) {
                throw new Error(
                  `The default branch advanced from tested base ${testedBaseSha} to ${baseRef.object.sha}; fresh CI is required.`
                );
              }
            };

            const assertUnchangedPull = async () => {
              const pull = await getPull();
              if (
                pull.state !== 'open' ||
                pull.draft ||
                pull.user?.login !== dependabot ||
                pull.head.sha !== expectedSha ||
                pull.head.ref !== run.head_branch ||
                pull.head.repo?.full_name !== `${owner}/${repo}` ||
                pull.base.ref !== repository.default_branch ||
                pull.base.sha !== testedBaseSha ||
                pull.commits !== 1
              ) {
                throw new Error('The PR identity, head, base, draft state, or commit count changed.');
              }
              return pull;
            };

            const assertNoBlockingReview = async () => {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              const changesRequested = new Set();
              for (const review of reviews) {
                const reviewer = review.user?.login;
                if (!reviewer) continue;
                if (review.state === 'CHANGES_REQUESTED') changesRequested.add(reviewer);
                if (review.state === 'APPROVED' || review.state === 'DISMISSED') {
                  changesRequested.delete(reviewer);
                }
              }
              if (changesRequested.size > 0) {
                throw new Error(`Changes are still requested by: ${[...changesRequested].join(', ')}.`);
              }

              let cursor = null;
              do {
                const data = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          nodes { isResolved }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: pullNumber, cursor }
                );
                const threads = data.repository.pullRequest.reviewThreads;
                if (threads.nodes.some((thread) => !thread.isResolved)) {
                  throw new Error('The PR has unresolved review threads.');
                }
                cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (cursor);
            };

            await assertBaseUnchanged();
            await assertUnchangedPull();

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: expectedSha,
            });
            if (
              commit.author?.login !== dependabot ||
              commit.commit.verification?.verified !== true
            ) {
              throw new Error('The PR head is not a verified Dependabot commit.');
            }

            const dependencyCount = [
              ...commit.commit.message.matchAll(/^\s*-\s+dependency-name:\s*.+$/gm),
            ].length;
            const updateTypes = [
              ...commit.commit.message.matchAll(/^\s*update-type:\s*(\S+)\s*$/gm),
            ].map((match) => match[1]);

            if (dependencyCount === 0 || updateTypes.length !== dependencyCount) {
              throw new Error('Dependabot update metadata is missing or incomplete.');
            }
            if (updateTypes.some((type) => !allowedUpdateTypes.has(type))) {
              core.notice(`Leaving PR #${pullNumber} for manual review: ${updateTypes.join(', ')}.`);
              return;
            }

            await assertNoBlockingReview();

            const deadline = Date.now() + 12 * 60 * 1000;
            let vercelStatus;
            while (Date.now() < deadline) {
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: expectedSha, per_page: 100 }
              );
              vercelStatus = statuses.find((status) => status.context === 'Vercel');

              if (vercelStatus?.state === 'success') break;
              if (vercelStatus && ['error', 'failure'].includes(vercelStatus.state)) {
                throw new Error(`Vercel finished with state ${vercelStatus.state}.`);
              }

              core.info(`Waiting for Vercel on ${expectedSha} (current: ${vercelStatus?.state ?? 'missing'}).`);
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            if (vercelStatus?.state !== 'success') {
              throw new Error('Timed out waiting for a successful Vercel deployment.');
            }
            const vercelUrl = new URL(vercelStatus.target_url);
            if (
              vercelStatus.creator?.login !== 'vercel[bot]' ||
              (vercelUrl.hostname !== 'vercel.com' && !vercelUrl.hostname.endsWith('.vercel.com'))
            ) {
              throw new Error('The Vercel status was not published by the expected integration.');
            }

            await assertUnchangedPull();
            await assertNoBlockingReview();
            // Keep this as the last API read before the SHA-guarded merge.
            await assertBaseUnchanged();

            const { data: result } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              merge_method: 'squash',
              sha: expectedSha,
            });
            if (!result.merged) {
              throw new Error(result.message || 'GitHub refused to merge the PR.');
            }

            core.notice(`Merged Dependabot PR #${pullNumber} at ${expectedSha}.`);
