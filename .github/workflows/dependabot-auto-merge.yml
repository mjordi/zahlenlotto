name: Dependabot Auto-Merge

on:
  # Whichever finishes last (CI or Vercel) re-checks both gates.
  workflow_run:
    workflows: [CI]
    types: [completed]
  status: {}

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'status' &&
       github.event.context == 'Vercel' &&
       github.event.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge eligible Dependabot update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha
              : context.payload.sha;
            const base = context.payload.repository.default_branch;

            // Find the one same-repository Dependabot PR for this exact commit.
            const { data: associated } = await github.rest.repos
              .listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const matches = associated.filter(pr =>
              pr.state === 'open' &&
              pr.user?.login === 'dependabot[bot]' &&
              pr.head.sha === sha &&
              pr.head.repo?.full_name === `${owner}/${repo}` &&
              pr.head.ref.startsWith('dependabot/') &&
              pr.base.ref === base
            );
            if (matches.length !== 1) {
              core.info(`Expected one eligible Dependabot PR; found ${matches.length}.`);
              return;
            }
            const number = matches[0].number;

            // Require successful CI and Vercel results for the same SHA.
            const [
              { data: pr }, { data: runs }, { data: combined },
              { data: commit }, { data: mergeCommit }
            ] =
              await Promise.all([
                github.rest.pulls.get({ owner, repo, pull_number: number }),
                github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, event: 'pull_request', head_sha: sha, per_page: 100
                }),
                github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha }),
                github.rest.repos.getCommit({ owner, repo, ref: sha }),
                github.rest.repos.getCommit({
                  owner, repo, ref: `refs/pull/${number}/merge`
                })
              ]);
            const ci = runs.workflow_runs.find(run =>
              run.name === 'CI' &&
              run.pull_requests.some(candidate =>
                candidate.number === number && candidate.head.sha === sha
              )
            );
            const vercel = combined.statuses.find(status => status.context === 'Vercel');
            if (ci?.conclusion !== 'success' || vercel?.state !== 'success') {
              core.info('Waiting for CI and Vercel to succeed.');
              return;
            }
            if (vercel.creator?.login !== 'vercel[bot]') {
              throw new Error('The Vercel status was not published by vercel[bot].');
            }

            // Bind CI to the temporary merge commit (base + PR head) it tested.
            const testedBase = mergeCommit.parents[0]?.sha;
            const testedHead = mergeCommit.parents[1]?.sha;
            const mergeCreated = Date.parse(mergeCommit.commit.committer.date);
            const ciCreated = Date.parse(ci.created_at);
            if (
              mergeCommit.parents.length !== 2 ||
              testedHead !== sha ||
              !Number.isFinite(mergeCreated) ||
              mergeCreated > ciCreated ||
              ciCreated - mergeCreated > 5 * 60 * 1000
            ) {
              core.info('CI did not test the current PR merge commit; fresh CI is required.');
              return;
            }

            // Major or unrecognized updates remain manual.
            const updateTypes = [
              ...commit.commit.message.matchAll(/^\s*update-type:\s*(\S+)\s*$/gm)
            ].map(match => match[1]);
            if (
              pr.commits !== 1 ||
              commit.author?.login !== 'dependabot[bot]' ||
              commit.commit.verification?.verified !== true ||
              updateTypes.length === 0 ||
              updateTypes.some(type =>
                !/^version-update:semver-(patch|minor)$/.test(type)
              )
            ) {
              core.info('Not a verified single-commit patch/minor update; leaving it manual.');
              return;
            }

            // Re-check mutable state immediately before merging the expected SHA.
            const [{ data: latest }, { data: baseRef }, reviews, reviewData] =
              await Promise.all([
                github.rest.pulls.get({ owner, repo, pull_number: number }),
                github.rest.git.getRef({ owner, repo, ref: `heads/${base}` }),
                github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: number, per_page: 100
                }),
                github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100) {
                          nodes { isResolved isOutdated }
                          pageInfo { hasNextPage }
                        }
                      }
                    }
                  }
                `, { owner, repo, number })
              ]);
            const threads = reviewData.repository.pullRequest.reviewThreads;
            const reviewStates = new Map(reviews
              .filter(review => review.user?.login && review.state !== 'COMMENTED')
              .map(review => [review.user.login, review.state]));
            if (
              !testedBase ||
              latest.state !== 'open' ||
              latest.draft ||
              latest.head.sha !== sha ||
              latest.base.ref !== base ||
              baseRef.object.sha !== testedBase ||
              [...reviewStates.values()].includes('CHANGES_REQUESTED') ||
              threads.pageInfo.hasNextPage ||
              threads.nodes.some(thread => !thread.isResolved && !thread.isOutdated)
            ) {
              core.info('The PR, review state, or tested base changed; leaving it manual.');
              return;
            }

            const { data: result } = await github.rest.pulls.merge({
              owner, repo, pull_number: number, merge_method: 'squash', sha
            });
            if (!result.merged) throw new Error(result.message || 'GitHub refused the merge.');
