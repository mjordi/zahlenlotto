name: Dependabot Auto-Merge

on:
  # Re-check when either CI or Vercel finishes last.
  workflow_run:
    workflows: [CI]
    types: [completed]
  status: {}

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'status' &&
       github.event.context == 'Vercel' &&
       github.event.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge eligible Dependabot update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha
              : context.payload.sha;
            const base = context.payload.repository.default_branch;

            const { data: associated } = await github.rest.repos
              .listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const matches = associated.filter(pr =>
              pr.state === 'open' &&
              pr.user?.login === 'dependabot[bot]' &&
              pr.head.sha === sha &&
              pr.head.repo?.full_name === `${owner}/${repo}` &&
              pr.head.ref.startsWith('dependabot/') &&
              pr.base.ref === base
            );
            if (matches.length !== 1) return;
            const number = matches[0].number;

            const [{ data: runs }, { data: combined }, { data: commit }] =
              await Promise.all([
                github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, event: 'pull_request', head_sha: sha, per_page: 100
                }),
                github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha }),
                github.rest.repos.getCommit({ owner, repo, ref: sha })
              ]);

            // Runs are newest-first: the latest matching CI result is authoritative.
            const ci = runs.workflow_runs.find(run =>
              run.name === 'CI' &&
              run.pull_requests.some(pr => pr.number === number && pr.head.sha === sha)
            );
            const ciPull = ci?.pull_requests.find(pr => pr.number === number);
            const vercel = combined.statuses.find(status => status.context === 'Vercel');
            const updateTypes = [
              ...commit.commit.message.matchAll(/^\s*update-type:\s*(\S+)\s*$/gm)
            ].map(match => match[1]);

            if (
              ci?.conclusion !== 'success' ||
              vercel?.state !== 'success' ||
              vercel.creator?.login !== 'vercel[bot]' ||
              commit.author?.login !== 'dependabot[bot]' ||
              commit.commit.verification?.verified !== true ||
              updateTypes.length === 0 ||
              updateTypes.some(type => type === 'version-update:semver-major')
            ) return;

            const { data: latest } = await github.rest.pulls.get({
              owner, repo, pull_number: number
            });
            if (
              latest.state !== 'open' ||
              latest.draft ||
              latest.commits !== 1 ||
              latest.head.sha !== sha ||
              latest.base.sha !== ciPull?.base.sha
            ) return;

            const { data: result } = await github.rest.pulls.merge({
              owner, repo, pull_number: number, merge_method: 'squash', sha
            });
            if (!result.merged) throw new Error(result.message || 'GitHub refused the merge.');
